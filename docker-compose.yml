services:
  postgres:
    image: postgres:16
    container_name: corporate-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corporate_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: corporate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  portal-mock:
    build:
      context: ./apps/portal-mock
    container_name: portal-mock
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./apps/portal-mock/.env

  chat-server:
    build: ./apps/chat-server
    container_name: "corporate-chat"
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    ports:
      - "3000:3000"
    env_file:
      - ./apps/chat-server/.env
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001
    depends_on:
      - postgres
      - minio
      - portal-mock

volumes:
  postgres_data:
  minio_data:
