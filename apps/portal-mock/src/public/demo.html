<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Демо портала — встроенный чат</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 260px; padding: 16px; border-right: 1px solid #e5e7eb; }
        #widget-container { flex: 1; display: flex; flex-direction: column; }
        iframe { flex: 1; border: none; }
        #controls { padding: 12px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: center; }
        #log { font-size: 12px; color: #555; max-height: 150px; overflow: auto; padding: 8px; background: #fafafa; }
        select, button { padding: 6px 10px; }
        #unread-badge { background: #3b5a7a; color: white; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>Портал (заглушка)</h3>
        <p>Пользователь: <span id="user-select"></span></p>
        <select id="userSelect">
            <option value="b4bf0b67-6b40-4035-8ee7-0a8f0984ac99">Юрий Тестировщик</option>
            <option value="21be610f-8ec5-4225-8880-a80d7029c2ea">Андрей Проджект</option>
            <option value="c3d4e5f6-1a2b-4c3d-9e4f-5a6b7c8d9e0f">Мария Иванова</option>
            <option value="d4e5f6a7-2b3c-4d4e-8f5a-6b7c8d9e0f1a">Дмитрий Петров</option>
            <option value="e5f6a7b8-3c4d-4e5f-9a6b-7c8d9e0f1a2b">Анна Смирнова</option>
        </select>
        <p>Непрочитано: <span id="unread-badge">0</span></p>
    </div>
    <div id="widget-container">
        <div id="controls">
            <button id="themeToggle">Сменить тему</button>
            <button id="localeToggle">Сменить язык</button>
            <button id="reloadToken">Обновить токен</button>
        </div>
        <iframe id="chatFrame" src="http://localhost:5173"></iframe>
        <div id="log"></div>
    </div>

    <script>
        const CHAT_ORIGIN = 'http://localhost:5173';
        const PORTAL_API = 'http://localhost:3001';
        const USERS = {
            'b4bf0b67-6b40-4035-8ee7-0a8f0984ac99': 'Юрий Тестировщик',
            '21be610f-8ec5-4225-8880-a80d7029c2ea': 'Андрей Проджект',
            'c3d4e5f6-1a2b-4c3d-9e4f-5a6b7c8d9e0f': 'Мария Иванова',
            'd4e5f6a7-2b3c-4d4e-8f5a-6b7c8d9e0f1a': 'Дмитрий Петров',
            'e5f6a7b8-3c4d-4e5f-9a6b-7c8d9e0f1a2b': 'Анна Смирнова',
        };
        const frame = document.getElementById('chatFrame');
        const logEl = document.getElementById('log');
        const userSelect = document.getElementById('userSelect');
        const unreadBadge = document.getElementById('unread-badge');
        let currentTheme = 'light';
        let currentLocale = 'ru';
        let isWidgetReady = false;
        let pendingToken = null;

        function log(msg) {
            const line = document.createElement('div');
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.prepend(line);
        }

        async function sendToken() {
            const userId = userSelect.value;
            const res = await fetch(`${PORTAL_API}/auth/token/${userId}`);
            const { token } = await res.json();
            if (isWidgetReady) {
                frame.contentWindow.postMessage({ type: 'portal:auth', token }, CHAT_ORIGIN);
                log(`Токен отправлен для ${USERS[userId]}`);
                sendThemeAndLocale();
            } else {
                pendingToken = token;
                log('Ожидаем chat:ready...');
            }
        }

        function sendThemeAndLocale() {
            frame.contentWindow.postMessage({ type: 'portal:theme', mode: currentTheme }, CHAT_ORIGIN);
            frame.contentWindow.postMessage({ type: 'portal:locale', locale: currentLocale }, CHAT_ORIGIN);
            log(`Тема: ${currentTheme}, Язык: ${currentLocale}`);
        }

        userSelect.addEventListener('change', sendToken);

        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            if (isWidgetReady) {
                frame.contentWindow.postMessage({ type: 'portal:theme', mode: currentTheme }, CHAT_ORIGIN);
                log(`Тема изменена на: ${currentTheme}`);
            } else {
                log('Виджет ещё не готов');
            }
        });

        document.getElementById('localeToggle').addEventListener('click', () => {
            currentLocale = currentLocale === 'ru' ? 'en' : 'ru';
            if (isWidgetReady) {
                frame.contentWindow.postMessage({ type: 'portal:locale', locale: currentLocale }, CHAT_ORIGIN);
                log(`Язык изменён на: ${currentLocale}`);
            } else {
                log('Виджет ещё не готов');
            }
        });

        document.getElementById('reloadToken').addEventListener('click', sendToken);

        window.addEventListener('message', (event) => {
            if (event.origin !== CHAT_ORIGIN) return;
            const { type, ...payload } = event.data || {};

            if (type === 'chat:ready') {
                isWidgetReady = true;
                log('Получено chat:ready');
                if (pendingToken) {
                    frame.contentWindow.postMessage({ type: 'portal:auth', token: pendingToken }, CHAT_ORIGIN);
                    log(`Токен отправлен для ${USERS[userSelect.value]}`);
                    sendThemeAndLocale();
                    pendingToken = null;
                }
            } else if (type === 'chat:unread-count') {
                unreadBadge.textContent = payload.total;
                log(`chat:unread-count: ${payload.total}`);
            } else if (type === 'chat:open-object') {
                log(`chat:open-object: ${payload.objectId}`);
            } else if (type === 'chat:token-expired') {
                log('chat:token-expired — обновляем токен');
                sendToken();
            }
        });
    </script>
    </body>
</html>
